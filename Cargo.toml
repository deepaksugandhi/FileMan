[package]
name = "fileman"
version = "0.1.3"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.36.1"
egui = "0.36.1"
egui_extras = "0.36.1"
flate2 = "1.1"
raw-window-handle = "0.6"
rfd = "0.15"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
trash = "5.2.6"
winreg = "0.55"
windows = { version = "0.61", features = ["Win32_NetworkManagement_WNet", "Win32_System_Com", "Win32_System_Memory", "Win32_Security", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zip = "8.6"

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winresource = "0.1"

